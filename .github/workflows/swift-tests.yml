name: Swift package tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test TBFileManager (macOS)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Run Swift package tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/tbfilemanager-swift-test.log"

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tbfilemanager-swift-test-log
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/tbfilemanager-swift-test.log
